server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:property_intelligence}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B597037733976244226452948404D635166546A576E5A7234753778214125442A472D}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Location Provider Configuration (Supported: overpass, mock)
app.location.provider=${LOCATION_PROVIDER:overpass}
app.location.overpass.url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
app.location.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.location.google.api-key=${GOOGLE_MAPS_API_KEY:}
app.location.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

